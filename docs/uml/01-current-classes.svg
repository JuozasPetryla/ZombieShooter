xt><text fill="#172033" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="936.1543" x="6002.3579" y="4488.2289">Solid association arrows describe object references, not exclusive ownership. Dotted arrows show selected behavioral dependencies.</text><text fill="#172033" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="896.3555" x="6002.3579" y="4504.5257">Parameter/return-type dependencies and enum attribute arrows are omitted; those types remain visible in member signatures.</text><text fill="#172033" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="725.6143" x="6002.3579" y="4520.8226">Multiplicities describe initialized valid states; repeated field slots (e.g. pistol/shotgun) count separately.</text><text fill="#172033" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="693.834" x="6002.3579" y="4537.1195">0..* at a referring end permits sharing; 0..1 at a composition owner end permits a standalone part.</text><text fill="#172033" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="908.9541" x="6002.3579" y="4553.4164">Inheritance, interface implementations and dependency arrows do not carry multiplicities. External base types show names only.</text><text fill="#172033" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="767.4229" x="6002.3579" y="4569.7132">Top-level Program.cs entry-point statements, local variables/functions and tests are outside this class model.</text></g><?plantuml-src xJtRTXitak_y2XpbOQaHHSko7JkoennTh5WJEzQ8YftBoT5faH3Pexvm6arAZCSv-n7xXVibMxWsq0sWGOhEPIT-i9hTXG9Gg1iA1Q2ComIZ7_FqAiPeCCdp4XVeV__xVz0mJwS9BZ4Y-QmOukqH7YPHWKS8_X22qdo4aqwPJr6PewkyBFCKZU823yiuppe4boYBKaocqH0Fy3GgeZ8lK9Pdk4Dkueo-I3ccWx8iugjPYK-7UJQ8Vy5eHmE1yZVH60_A1RIIOe-oSQBZ89DebD_6sHXTHmdHlrn1qN6HpxBHKPv0vP-Ti7yQn0XVHxEaFCcpybjeB3h6_upUpT0WoeWTYZNluMFxHr7BmwUxEuyUrNjvsDeO1lOAHoDSD81VFZlPEJbeuCmB01OWJtO_V_Aq0TBQBaLz7wGOX6OVdfmyEp